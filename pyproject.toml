[project]
name = "max-miniapp-fastapi"
version = "0.2.0"
description = "MAX Mini App + FastAPI + PostgreSQL starter"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.118",
    "uvicorn>=0.37",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.11",
    "python-jose[cryptography]>=3.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
